---
- name: Remove conflicting packages
  ansible.builtin.apt:
    name: "{{ docker_packages.conflicting }}"
    state: absent

- name: Install common packages
  ansible.builtin.apt:
    name: "{{ docker_packages.common }}"
    state: present

- name: Ensure dir /etc/apt/keyrings exists
  ansible.builtin.file:
    name: "/etc/apt/keyrings"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Download Docker repository GPG key
  ansible.builtin.get_url:
    url: "{{ docker_repository_url }}/gpg"
    dest: "{{ docker_repository_gpg_key_path }}"
    mode: "0644"
    owner: root
    group: root

- name: Add Docker repository to APT
  ansible.builtin.template:
    src: "docker.sources.j2"
    dest: "/etc/apt/sources.list.d/docker.sources"
    mode: "0644"
    owner: root
    group: root
  notify: docker_restart

- name: Add current user in docker group
  ansible.builtin.user:
    name: "{{ ansible_user }}"
    groups: docker
    append: true

- name: Install Docker packages
  ansible.builtin.apt:
    name: "{{ docker_packages.required }}"
    state: present
    update_cache: true

- name: Ensure Docker running
  ansible.builtin.service:
    name: docker
    state: started
    enabled: true
...